packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  sharp: true

# Single React types version across web (React 19) and mobile so the ambient
# React namespace can't clash during the web typecheck.
overrides:
  "@types/react": "19.2.17"
